<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vande Mart Audio Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}
header{background:#111827;color:white;padding:18px}
main{max-width:900px;margin:auto;padding:16px}
.card{background:white;padding:18px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,button{padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ccd}
button{cursor:pointer;background:#111827;color:white}
button.danger{background:#b91c1c}
.branch{display:inline-block;margin:5px;padding:8px;background:#eef2ff;border-radius:8px}
.status{font-weight:bold}
.announcement{margin-top:12px}
</style>
</head>
<body>
<header><h2>Vande Mart Central Audio</h2></header>

<main>
<div class="card">
<h3>Add Branch</h3>
<input id="branchName" placeholder="Branch name">
<input id="branchCode" placeholder="Unique code e.g. KURNOOL01">
<button onclick="addBranch()">Add Branch</button>
<div id="branches"></div>
</div>

<div class="card">
<h3>Upload Announcement</h3>
<p style="margin-top:0">If the same title already exists, it will be updated instead of creating a duplicate.</p>

<input id="title" placeholder="Announcement title"><br>
<input id="audio" type="file" accept="audio/*"><br>

<label>Interval (minutes)</label><br>
<input id="interval" type="number" value="15" min="1"><br>

<label>Start time</label><br>
<input id="start" type="time" value="09:00"><br>

<label>End time</label><br>
<input id="end" type="time" value="21:00"><br>

<p>Select branches:</p>
<div id="branchChecks"></div>

<button onclick="uploadAnnouncement()">Upload / Update</button>
</div>

<div class="card">
<h3>Announcements</h3>
<div id="announcements"></div>
</div>
</main>

<script>
let branches = [];

async function load(){
  try{
    branches = await fetch("/api/branches").then(r => r.json());

    document.getElementById("branches").innerHTML =
      branches.map(b =>
        `<div class="branch">${escapeHtml(b.name)} (${escapeHtml(b.code)})</div>`
      ).join("");

    document.getElementById("branchChecks").innerHTML =
      branches.map(b =>
        `<label class="branch">
          <input type="checkbox" value="${b.id}">
          ${escapeHtml(b.name)}
        </label>`
      ).join("");

    const a = await fetch("/api/announcements").then(r => r.json());

    document.getElementById("announcements").innerHTML =
      a.length ? a.map(x => `
        <div class="card announcement">
          <b>${escapeHtml(x.title)}</b><br>
          Every ${x.interval_minutes} minutes,
          ${x.start_time}-${x.end_time}<br>
          Status:
          <span class="status">${x.active ? "ACTIVE" : "Stopped"}</span><br>

          ${x.active
            ? `<button onclick="stopA(${x.id})">Stop</button>`
            : `<button onclick="activate(${x.id})">Activate</button>`
          }

          <button class="danger" onclick="deleteA(${x.id})">
            Delete
          </button>
        </div>
      `).join("")
      : "<p>No announcements yet.</p>";

  }catch(e){
    alert("Could not load data: " + e.message);
  }
}

async function addBranch(){
  const name = document.getElementById("branchName").value.trim();
  const code = document.getElementById("branchCode").value.trim();

  if(!name || !code){
    return alert("Enter branch name and code");
  }

  const r = await fetch("/api/branches", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,code})
  });

  if(!r.ok){
    return alert((await r.json()).error);
  }

  document.getElementById("branchName").value = "";
  document.getElementById("branchCode").value = "";
  load();
}

async function uploadAnnouncement(){
  const file = document.getElementById("audio").files[0];

  if(!file){
    return alert("Choose an audio file");
  }

  const ids = [
    ...document.querySelectorAll("#branchChecks input:checked")
  ].map(x => Number(x.value));

  if(!ids.length){
    return alert("Select at least one branch");
  }

  const titleValue =
    document.getElementById("title").value.trim() || file.name;

  const fd = new FormData();

  fd.append("title", titleValue);
  fd.append("audio", file);
  fd.append(
    "interval_minutes",
    document.getElementById("interval").value
  );
  fd.append(
    "start_time",
    document.getElementById("start").value
  );
  fd.append(
    "end_time",
    document.getElementById("end").value
  );
  fd.append("branch_ids", JSON.stringify(ids));

  const r = await fetch("/api/announcements", {
    method:"POST",
    body:fd
  });

  const result = await r.json();

  if(!r.ok){
    return alert(result.error || "Upload failed");
  }

  alert(
    result.updated
      ? "Existing announcement updated. No duplicate created."
      : "Announcement uploaded."
  );

  document.getElementById("audio").value = "";
  load();
}

async function activate(id){
  await fetch("/api/announcements/" + id + "/activate", {
    method:"POST"
  });
  load();
}

async function stopA(id){
  await fetch("/api/announcements/" + id + "/stop", {
    method:"POST"
  });
  load();
}

async function deleteA(id){
  if(!confirm("Delete this announcement permanently?")){
    return;
  }

  const r = await fetch("/api/announcements/" + id, {
    method:"DELETE"
  });

  const result = await r.json();

  if(!r.ok){
    return alert(result.error || "Delete failed");
  }

  load();
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

load();
</script>
</body>
</html>
