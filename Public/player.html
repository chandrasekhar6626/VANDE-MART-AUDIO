<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vande Mart Branch Player</title>
<style>
body{font-family:Arial;text-align:center;background:#111827;color:white;padding:30px}
button{font-size:20px;padding:15px 25px;border:0;border-radius:10px}
#status{margin:25px;font-size:18px}
</style>
</head>
<body>
<h1>Vande Mart Audio Player</h1>
<div id="branch">Loading...</div>
<button id="enable" onclick="enableAudio()">🔊 Enable Speaker</button>
<div id="status">Waiting...</div>
<audio id="audio" preload="auto"></audio>

<script>
const code=new URLSearchParams(location.search).get("branch");
let enabled=false,lastPlayedKey="";
const audio=document.getElementById("audio");

async function enableAudio(){
  try{
    audio.src="";
    await audio.play().catch(()=>{});
    enabled=true;
    document.getElementById("enable").style.display="none";
    document.getElementById("status").textContent="Speaker enabled. Waiting for announcements...";
  }catch(e){alert("Please allow sound for this website.");}
}

async function check(){
  if(!code)return;
  const r=await fetch("/api/player/"+encodeURIComponent(code));
  if(!r.ok){document.getElementById("status").textContent="Branch not found";return;}
  const data=await r.json();
  document.getElementById("branch").textContent=data.branch.name+" ("+data.branch.code+")";
  if(!data.announcement)return;

  const now=new Date(data.serverTime);
  const mins=now.getHours()*60+now.getMinutes();
  const [sh,sm]=data.announcement.start_time.split(":").map(Number);
  const [eh,em]=data.announcement.end_time.split(":").map(Number);
  const start=sh*60+sm,end=eh*60+em;
  if(mins<start||mins>end)return;

  const interval=Number(data.announcement.interval_minutes)||15;
  const slot=Math.floor((mins-start)/interval);
  const key=data.announcement.id+"-"+now.toISOString().slice(0,10)+"-"+slot;
  if(enabled && key!==lastPlayedKey){
    lastPlayedKey=key;
    audio.src="/uploads/"+data.announcement.filename;
    audio.currentTime=0;
    audio.play().catch(()=>{document.getElementById("status").textContent="Tap Enable Speaker to allow audio.";});
    document.getElementById("status").textContent="🔊 Playing announcement";
  }
}
setInterval(check,1000);
check();
</script>
</body>
</html>
